[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vura-io"
version = "0.1.1"
description = "VURA I/O library for state management, metrics, and DuckDB relational JSON shredding"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "jsonschema>=4.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vura*"]
