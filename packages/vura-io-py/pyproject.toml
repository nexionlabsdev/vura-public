[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vura-io"
version = "1.0.0"
description = "VURA I/O library for state management, metrics, and DuckDB relational JSON shredding"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "pyarrow",
    "duckdb"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vura*"]
