name: Release core-extension

# Independent release for core-extension (VURA Studio VS Code extension).
# Trigger by pushing a tag like `core-extension@1.2.3`.
#
# Builds from THIS commit's own source via scripts/install-local-deps.sh
# (tarball overlay of core-sdk, vura-io and vura-runner, built fresh from the
# repo) rather than depending on whatever those packages currently have
# published — that's what makes this release independent of their release
# cadence. core-extension's package.json dependency ranges are left
# untouched.
#
# Optional secrets (skipped, not failed, if unset — the .vsix files are
# still built and attached to the GitHub Release either way):
#   VSCE_PAT   — Azure DevOps PAT for VS Code Marketplace publishing.
#   OVSX_PAT   — Open VSX Registry publishing token.
on:
  push:
    tags:
      - 'core-extension@*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3) — for manual/dry-run triggers'
        required: true

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            TAG="core-extension@${VERSION}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#core-extension@}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  package:
    name: Package core-extension (${{ matrix.target }})
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-13
          - target: darwin-arm64
            runner: macos-14
          - target: linux-x64
            runner: ubuntu-latest
          # Public-repo GitHub-hosted Linux ARM64 runners — if this label isn't
          # available on your plan/repo, drop this leg or point it at a
          # self-hosted arm64 runner instead.
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-x64
            runner: windows-latest
          # No GitHub-hosted win32-arm64 runner exists yet — that target needs
          # a self-hosted Windows-on-ARM runner if you need it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Update npm CLI
        shell: bash
        run: npm install -g npm@latest

      - name: Set version to ${{ needs.resolve-version.outputs.version }}
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/core-extension/package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('packages/core-extension/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build (via local tarball overlay — see workflow header comment)
        shell: bash
        run: ./scripts/install-local-deps.sh core-extension

      - name: Package
        shell: bash
        run: ./scripts/package-extension.sh core-extension --target ${{ matrix.target }} -o dist/vura-core-${{ matrix.target }}.vsix

      - name: Publish to VS Code Marketplace
        # secrets can't be referenced directly in `if:` (GitHub Actions
        # rejects it at parse time) — only `env` is a valid context there.
        if: ${{ env.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        # vsce infers the target from the already-packaged .vsix itself —
        # passing --target here too is rejected as a conflicting option.
        run: npx --yes @vscode/vsce publish --packagePath dist/vura-core-${{ matrix.target }}.vsix --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: npx --yes ovsx publish dist/vura-core-${{ matrix.target }}.vsix --target ${{ matrix.target }} --pat "$OVSX_PAT"

      - uses: actions/upload-artifact@v4
        with:
          name: vura-core-${{ matrix.target }}
          path: dist/vura-core-${{ matrix.target }}.vsix

  github-release:
    name: Create GitHub Release
    needs: [resolve-version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and attach .vsix files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.resolve-version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "core-extension v${{ needs.resolve-version.outputs.version }}" \
            --generate-notes \
            artifacts/*/*.vsix
