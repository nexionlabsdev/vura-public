name: Release core-extension

# Packages and publishes the vura-studio-lite VS Code extension across every target
# platform, at the given version. Called by release.yml as the step of the
# coordinated lockstep v*.*.* release that runs after the npm packages it
# depends on have been published (see that file's header comment) — it
# installs @vura-data-os/* as normal registry packages, since core-extension
# is deliberately NOT an npm workspace member. Also runnable standalone via
# workflow_dispatch to retry/repackage just this target set, as long as the
# npm packages for that version are already live.
#
# Optional secrets (skipped, not failed, if unset — the .vsix files are
# still built and uploaded as artifacts either way):
#   VSCE_PAT   — Azure DevOps PAT for VS Code Marketplace publishing.
#   OVSX_PAT   — Open VSX Registry publishing token.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to package (e.g. 1.2.3)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package core-extension (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 has been fully retired from GitHub's hosted runner fleet
          # (queues forever, never picked up by any runner) and macos-14 is
          # deprecated and due to retire next — macos-15-intel/macos-15 are
          # the current GA x64/arm64 labels.
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-latest
          # Public-repo GitHub-hosted Linux ARM64 runners — if this label isn't
          # available on your plan/repo, drop this leg or point it at a
          # self-hosted arm64 runner instead.
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-x64
            runner: windows-latest
          # No GitHub-hosted win32-arm64 runner exists yet — that target needs
          # a self-hosted Windows-on-ARM runner if you need it.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Update npm CLI
        shell: bash
        run: npm install -g npm@latest

      - name: Set version to ${{ inputs.version }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          node -e "
            const fs = require('fs');
            const path = 'packages/core/core-extension/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '$VERSION';
            if (pkg.dependencies) {
              for (const dep of Object.keys(pkg.dependencies)) {
                if (dep.startsWith('@vura-data-os/')) pkg.dependencies[dep] = '^$VERSION';
              }
            }
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "

      # core-extension is not an npm workspace member — its @vura-data-os/*
      # deps resolve as normal npm packages. By the time this runs,
      # release-core-sdk.yml / release-vura-odata-sync-core.yml /
      # release-vura-runner.yml have already published this exact version,
      # so a plain install here fetches the real thing from the registry
      # (no local tarball workaround needed at release time).
      #
      # npm's registry has some replication lag right after `npm publish`
      # returns success — `npm install` immediately after can still
      # 404/ETARGET on the version that was just published for up to a
      # minute or so, so poll for it here rather than race the CDN.
      - name: Wait for published core packages to be resolvable on the registry
        shell: bash
        run: |
          set -e
          for pkg in "@vura-data-os/core-sdk" "@vura-data-os/vura-runner"; do
            echo "Waiting for $pkg@${{ inputs.version }}..."
            for i in $(seq 1 20); do
              if npm view "$pkg@${{ inputs.version }}" version >/dev/null 2>&1; then
                echo "  -- available"
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "  -- still not resolvable after 20 attempts" >&2
                exit 1
              fi
              sleep 6
            done
          done

      - name: Install dependencies
        shell: bash
        run: cd packages/core/core-extension && npm install --no-audit --no-fund

      - name: Package
        shell: bash
        run: ./scripts/package-extension.sh core/core-extension --target ${{ matrix.target }} -o dist/vura-studio-lite-${{ matrix.target }}.vsix

      - name: Publish to VS Code Marketplace
        # secrets can't be referenced directly in `if:` (GitHub Actions
        # rejects it at parse time: "Unrecognized named-value: 'secrets'") —
        # only `env` is a valid context there, so route the check through it.
        if: ${{ env.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          PRE_RELEASE_FLAG=""
          VERSION="$(node -p "require('./packages/core/core-extension/package.json').version")"
          MINOR="$(echo "$VERSION" | cut -d. -f2)"
          if [ $((MINOR % 2)) -ne 0 ]; then
            PRE_RELEASE_FLAG="--pre-release"
          fi
          set +e
          OUTPUT=$(npx --yes @vscode/vsce publish --packagePath dist/vura-studio-lite-${{ matrix.target }}.vsix $PRE_RELEASE_FLAG --pat "$VSCE_PAT" 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -qE "already exists|already published"; then
              echo "vura-studio-lite (${{ matrix.target }}) v$VERSION already on the Marketplace — skipping."
            else
              exit $STATUS
            fi
          fi

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: |
          set +e
          OUTPUT=$(npx --yes ovsx publish dist/vura-studio-lite-${{ matrix.target }}.vsix --target ${{ matrix.target }} --pat "$OVSX_PAT" 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            if echo "$OUTPUT" | grep -qE "already exists|already published"; then
              echo "vura-studio-lite (${{ matrix.target }}) already on Open VSX — skipping."
            else
              exit $STATUS
            fi
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vura-studio-lite-${{ matrix.target }}
          path: dist/vura-studio-lite-${{ matrix.target }}.vsix
