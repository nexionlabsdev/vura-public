name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Update npm CLI
        shell: bash
        run: npm install -g npm@latest

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      # Dependency order matters: each of these imports the compiled `out/`
      # of the ones before it via the npm workspace symlinks.
      - name: Build core-sdk
        run: npm run compile --workspace=packages/core-sdk

      - name: Build vura-dataverse-sync-core
        run: npm run compile --workspace=packages/vura-dataverse-sync-core

      - name: Build vura-runner
        run: npm run compile --workspace=packages/vura-runner

      - name: Build vura-io
        run: npm run compile --workspace=packages/vura-io

      # core-extension is deliberately NOT a workspace
      # member (see root package.json) — it depends on @vura-data-os/* as
      # normal npm packages, resolved from the registry once published.
      # Before that, install-local-deps.sh overlays fresh tarballs of the
      # local library packages instead, so this build reflects the current
      # branch, not whatever's last published.
      - name: Build core-extension
        shell: bash
        run: |
          ./scripts/install-local-deps.sh core-extension
          cd packages/core-extension && npm run compile

      - name: Run vura-runner test suite
        run: npm test --workspace=packages/vura-runner

      - name: Run vura-io test suite (shredder & partitioning contracts)
        run: npm test --workspace=packages/vura-io

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run vura-io-py test suite (Python shredder contract)
        shell: bash
        run: |
          cd packages/vura-io-py
          pip install -e . pytest
          pytest

      - name: Run core-extension VS Code E2E integration tests
        shell: bash
        run: |
          cd packages/core-extension
          npm run test:e2e
