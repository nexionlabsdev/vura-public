name: Release

# Trigger by pushing a tag like `v1.2.3`. Every publishable package (the 3
# npm packages and the VS Code extension) is released in lockstep at that
# same version — this repo doesn't do independent per-package versioning.
# The actual publish logic for each target lives in its own workflow file
# (release-core-sdk.yml, release-vura-dataverse-sync-core.yml,
# release-vura-runner.yml, release-core-extension.yml) so it can also be
# re-run standalone via workflow_dispatch on just that one file if a single
# leg needs a retry — this file only resolves the version and wires the
# per-target jobs together in the right order.
#
# npm publishing uses OIDC trusted publishing — no NPM_TOKEN secret needed.
# One-time setup on npmjs.com for each of the 3 @vura-data-os/* packages:
# Package Settings -> Trusted Publisher -> GitHub Actions, then set
# Organization/Repository to this repo and Workflow filename to that
# package's own release-*.yml (not this file) — see each file's header.
#
# Optional secrets (skipped, not failed, if unset — the .vsix files are
# still built and attached to the GitHub Release either way):
#   VSCE_PAT   — Azure DevOps PAT for VS Code Marketplace publishing.
#   OVSX_PAT   — Open VSX Registry publishing token.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3) — for manual/dry-run triggers'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-version:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  release-core-sdk:
    name: core-sdk
    needs: determine-version
    uses: ./.github/workflows/release-core-sdk.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}
    secrets: inherit

  release-vura-dataverse-sync-core:
    name: vura-dataverse-sync-core
    needs: determine-version
    uses: ./.github/workflows/release-vura-dataverse-sync-core.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}
    secrets: inherit

  release-vura-runner:
    name: vura-runner
    needs: determine-version
    uses: ./.github/workflows/release-vura-runner.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}
    secrets: inherit

  release-core-extension:
    name: core-extension
    needs:
      - determine-version
      - release-core-sdk
      - release-vura-dataverse-sync-core
      - release-vura-runner
    uses: ./.github/workflows/release-core-extension.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}
    secrets: inherit

  github-release:
    name: Create GitHub Release
    needs: [determine-version, release-core-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and attach .vsix files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.determine-version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "v${{ needs.determine-version.outputs.version }}" \
            --generate-notes \
            artifacts/*/*.vsix
