name: CI - vura-runner

# vura-runner bundles a platform-specific native duckdb.node, hence the full
# OS matrix. Path-filtered to its own tree plus the workspace libraries it
# actually imports.
on:
  push:
    branches: [main]
    paths:
      - 'packages/core/vura-runner/**'
      - 'packages/core/core-sdk/**'
      - 'packages/core/vura-io/**'
      - '.github/workflows/ci-vura-runner.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/core/vura-runner/**'
      - 'packages/core/core-sdk/**'
      - 'packages/core/vura-io/**'
      - '.github/workflows/ci-vura-runner.yml'
  workflow_dispatch: {}

concurrency:
  group: ci-vura-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Update npm CLI
        shell: bash
        run: npm install -g npm@latest

      - run: npm install --no-audit --no-fund

      # Dependency order matters: vura-runner imports the compiled `out/` of
      # these via npm workspace symlinks.
      - name: Build core-sdk
        run: npm run compile --workspace=packages/core/core-sdk

      - name: Build vura-io
        run: npm run compile --workspace=packages/core/vura-io

      - name: Build vura-runner
        run: npm run compile --workspace=packages/core/vura-runner

      - name: Run vura-runner test suite
        run: npm test --workspace=packages/core/vura-runner
