name: Release vura-io-py

# Builds and releases the vura-io Python package (sdist and wheel).
# Called by release.yml as one step of the coordinated lockstep v*.*.* release.
#
# Attaches the built wheel and sdist to the GitHub release assets, and optionally
# publishes to PyPI if PYPI_API_TOKEN is set or PyPI trusted publishing is configured.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.2.3)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # for PyPI trusted publishing if configured

jobs:
  build-and-release:
    name: Build & publish vura-io (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update version to ${{ inputs.version }}
        run: |
          sed -i.bak -E 's/^version = .*/version = "${{ inputs.version }}"/' packages/core/vura-io-py/pyproject.toml
          rm -f packages/core/vura-io-py/pyproject.toml.bak

      - name: Install build dependencies and run tests
        run: |
          cd packages/core/vura-io-py
          pip install --upgrade pip build wheel pytest
          pip install -e .
          pytest

      - name: Build sdist and wheel
        run: |
          cd packages/core/vura-io-py
          python -m build

      - name: Upload Python Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vura-io-py
          path: packages/core/vura-io-py/dist/*

      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/core/vura-io-py/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
